<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#f8fbff"/>
<text x="70" y="70" font-size="34" font-weight="700" fill="#0f172a">Hệ điều hành là cầu nối của hệ thống</text>
<text x="70" y="110" font-size="20" fill="#475569">Mọi yêu cầu từ người dùng và ứng dụng đều đi qua hệ điều hành trước khi tới phần cứng.</text>
<g font-family="Arial, sans-serif">
  <rect x="160" y="170" rx="28" ry="28" width="880" height="90" fill="#dbeafe" stroke="#0ea5e9" stroke-width="3"/>
  <text x="600" y="225" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">👤 Người dùng</text>
  <rect x="160" y="300" rx="28" ry="28" width="880" height="90" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="600" y="355" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">🧩 Phần mềm ứng dụng</text>
  <rect x="160" y="430" rx="28" ry="28" width="880" height="90" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  <text x="600" y="485" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">⚙️ Hệ điều hành</text>
  <rect x="160" y="560" rx="28" ry="28" width="880" height="90" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
  <text x="600" y="615" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">💻 Phần cứng</text>
  <path d="M600 260 L600 300" stroke="#0ea5e9" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M600 390 L600 430" stroke="#0ea5e9" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M600 520 L600 560" stroke="#0ea5e9" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="1030" y="350" font-size="20" fill="#475569">Ví dụ: mở tệp, in tài liệu, nghe nhạc</text>
  <text x="1020" y="485" font-size="20" fill="#475569">Quản lí tệp, bộ nhớ, thiết bị, giao diện</text>
</g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker></defs>
</svg>