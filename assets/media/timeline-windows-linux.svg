<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#f8fbff"/>
<text x="70" y="70" font-size="34" font-weight="700" fill="#0f172a">Dòng thời gian rút gọn: Windows và Linux</text>
<text x="70" y="110" font-size="20" fill="#475569">Các mốc trong bài học giúp học sinh nhận ra xu hướng: thân thiện hơn, trực quan hơn và linh hoạt hơn.</text>
<line x1="120" y1="240" x2="1080" y2="240" stroke="#0ea5e9" stroke-width="5"/>
<line x1="120" y1="470" x2="1080" y2="470" stroke="#22c55e" stroke-width="5"/>
<text x="70" y="246" font-size="28" font-weight="700" fill="#0f172a">Windows</text>
<text x="70" y="476" font-size="28" font-weight="700" fill="#0f172a">Linux</text>
<g font-family="Arial,sans-serif">
  <g fill="#0f172a">
    <circle cx="180" cy="240" r="12" fill="#0ea5e9"/><text x="180" y="210" text-anchor="middle" font-size="18" font-weight="700">1985</text><text x="180" y="280" text-anchor="middle" font-size="18">Windows 1</text>
    <circle cx="290" cy="240" r="12" fill="#0ea5e9"/><text x="290" y="210" text-anchor="middle" font-size="18" font-weight="700">1990</text><text x="290" y="280" text-anchor="middle" font-size="18">Windows 3</text>
    <circle cx="400" cy="240" r="12" fill="#0ea5e9"/><text x="400" y="210" text-anchor="middle" font-size="18" font-weight="700">1995</text><text x="400" y="280" text-anchor="middle" font-size="18">Windows 95</text>
    <circle cx="510" cy="240" r="12" fill="#0ea5e9"/><text x="510" y="210" text-anchor="middle" font-size="18" font-weight="700">2001</text><text x="510" y="280" text-anchor="middle" font-size="18">Windows XP</text>
    <circle cx="650" cy="240" r="12" fill="#0ea5e9"/><text x="650" y="210" text-anchor="middle" font-size="18" font-weight="700">2009</text><text x="650" y="280" text-anchor="middle" font-size="18">Windows 7</text>
    <circle cx="760" cy="240" r="12" fill="#0ea5e9"/><text x="760" y="210" text-anchor="middle" font-size="18" font-weight="700">2012</text><text x="760" y="280" text-anchor="middle" font-size="18">Windows 8</text>
    <circle cx="870" cy="240" r="12" fill="#0ea5e9"/><text x="870" y="210" text-anchor="middle" font-size="18" font-weight="700">2015</text><text x="870" y="280" text-anchor="middle" font-size="18">Windows 10</text>
    <circle cx="980" cy="240" r="12" fill="#0ea5e9"/><text x="980" y="210" text-anchor="middle" font-size="18" font-weight="700">2021</text><text x="980" y="280" text-anchor="middle" font-size="18">Windows 11</text>
    <circle cx="320" cy="470" r="12" fill="#22c55e"/><text x="320" y="440" text-anchor="middle" font-size="18" font-weight="700">1969</text><text x="320" y="510" text-anchor="middle" font-size="18">UNIX</text>
    <circle cx="520" cy="470" r="12" fill="#22c55e"/><text x="520" y="440" text-anchor="middle" font-size="18" font-weight="700">1991</text><text x="520" y="510" text-anchor="middle" font-size="18">Linux bắt đầu</text>
    <circle cx="650" cy="470" r="12" fill="#22c55e"/><text x="650" y="440" text-anchor="middle" font-size="18" font-weight="700">1994</text><text x="650" y="510" text-anchor="middle" font-size="18">Linux 1.0</text>
    <rect x="790" y="430" width="230" height="80" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="905" y="464" text-anchor="middle" font-size="20" font-weight="700">Bản phân phối</text><text x="905" y="494" text-anchor="middle" font-size="18">Red Hat · SUSE · Ubuntu</text>
  </g>
</g></svg>