<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#f8fbff"/>
<text x="70" y="70" font-size="34" font-weight="700" fill="#0f172a">Năm nhóm chức năng chính của hệ điều hành</text>
<circle cx="600" cy="360" r="95" fill="#0ea5e9" opacity="0.15" stroke="#0284c7" stroke-width="4"/>
<text x="600" y="348" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Hệ điều hành</text>
<text x="600" y="382" text-anchor="middle" font-size="18" fill="#475569">Điều phối và hỗ trợ</text>
<g font-family="Arial, sans-serif" fill="#0f172a">
  <g><rect x="120" y="130" width="260" height="110" rx="24" fill="#dbeafe" stroke="#0ea5e9" stroke-width="3"/><text x="250" y="175" text-anchor="middle" font-size="24" font-weight="700">Quản lí thiết bị</text><text x="250" y="207" text-anchor="middle" font-size="18">CPU · RAM · Máy in · Bàn phím</text><path d="M380 240 L525 315" stroke="#0ea5e9" stroke-width="4"/></g>
  <g><rect x="820" y="130" width="260" height="110" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="950" y="175" text-anchor="middle" font-size="24" font-weight="700">Quản lí dữ liệu</text><text x="950" y="207" text-anchor="middle" font-size="18">Tệp · Thư mục · Lưu trữ</text><path d="M820 240 L675 315" stroke="#22c55e" stroke-width="4"/></g>
  <g><rect x="90" y="490" width="290" height="110" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="235" y="535" text-anchor="middle" font-size="24" font-weight="700">Điều phối chương trình</text><text x="235" y="567" text-anchor="middle" font-size="18">Tiến trình · Tài nguyên · CPU</text><path d="M380 490 L515 405" stroke="#f59e0b" stroke-width="4"/></g>
  <g><rect x="440" y="560" width="320" height="110" rx="24" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="600" y="605" text-anchor="middle" font-size="24" font-weight="700">Giao tiếp với người dùng</text><text x="600" y="637" text-anchor="middle" font-size="18">GUI · CLI · Cửa sổ · Biểu tượng</text><path d="M600 560 L600 455" stroke="#8b5cf6" stroke-width="4"/></g>
  <g><rect x="840" y="490" width="260" height="110" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="970" y="535" text-anchor="middle" font-size="24" font-weight="700">Tiện ích hệ thống</text><text x="970" y="567" text-anchor="middle" font-size="18">Nén tệp · Quét lỗi · Gỡ ứng dụng</text><path d="M840 490 L685 405" stroke="#ef4444" stroke-width="4"/></g>
