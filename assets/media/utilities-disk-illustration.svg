  <rect x="650" y="180" width="420" height="420" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="860" y="235" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Nhớ điều này</text>
  <text x="700" y="295" font-size="22" fill="#0f172a">• Check / Scan: kiểm tra, phát hiện lỗi.</text>
  <text x="700" y="345" font-size="22" fill="#0f172a">• Repair: minh họa sửa lỗi logic.</text>
  <text x="700" y="395" font-size="22" fill="#0f172a">• Optimize: tổ chức lại dữ liệu.</text>
  <text x="700" y="465" font-size="22" fill="#0f172a">• Đây là mô phỏng giáo dục,</text>
  <text x="720" y="500" font-size="22" fill="#0f172a">không thay đổi ổ đĩa thật.</text>
  <text x="700" y="560" font-size="20" fill="#475569">Hợp mảnh không nên được áp dụng máy móc cho mọi loại ổ đĩa.</text>
