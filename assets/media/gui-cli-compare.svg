<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#f8fbff"/>
<text x="70" y="70" font-size="34" font-weight="700" fill="#0f172a">GUI và CLI: hai cách giao tiếp với hệ điều hành</text>
<g>
  <rect x="100" y="150" width="460" height="480" rx="26" fill="#dbeafe" stroke="#0ea5e9" stroke-width="4"/>
  <text x="330" y="205" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">GUI</text>
  <text x="330" y="238" text-anchor="middle" font-size="20" fill="#475569">Graphical User Interface</text>
  <rect x="150" y="280" width="360" height="220" rx="18" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="150" y="280" width="360" height="34" rx="18" fill="#cbd5e1"/>
  <circle cx="175" cy="297" r="7" fill="#ef4444"/><circle cx="198" cy="297" r="7" fill="#f59e0b"/><circle cx="221" cy="297" r="7" fill="#22c55e"/>
  <rect x="185" y="338" width="70" height="70" rx="16" fill="#dbeafe"/><rect x="285" y="338" width="70" height="70" rx="16" fill="#fef3c7"/><rect x="385" y="338" width="70" height="70" rx="16" fill="#dcfce7"/>
  <text x="330" y="540" text-anchor="middle" font-size="20" fill="#0f172a">Trực quan · Dễ làm quen · Dùng chuột/chạm</text>

  <rect x="640" y="150" width="460" height="480" rx="26" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/>
  <text x="870" y="205" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">CLI</text>
  <text x="870" y="238" text-anchor="middle" font-size="20" fill="#475569">Command-line Interface</text>
  <rect x="690" y="280" width="360" height="220" rx="18" fill="#0f172a" stroke="#334155"/>
  <text x="720" y="335" font-size="24" fill="#22c55e">&gt; dir /w</text>
  <text x="720" y="380" font-size="24" fill="#22c55e">&gt; cd Documents</text>
  <text x="720" y="425" font-size="24" fill="#22c55e">&gt; copy Bai1.txt USB</text>
  <text x="870" y="540" text-anchor="middle" font-size="20" fill="#0f172a">Mạnh khi tự động hóa · Cần nhớ cú pháp</text>
</g></svg>